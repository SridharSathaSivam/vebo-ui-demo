name: Deploy Vebo UI Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo
        uses: actions/checkout@v4
      - name: Checkout private Vebo UI source
        uses: actions/checkout@v4
        with:
          repository: SridharSathaSivam/vebo-ui
          path: vebo-source
          token: ${{ secrets.VEBO_UI_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build Vebo UI
        working-directory: vebo-source
        run: |
          npm install
          npm run build
          npx --yes esbuild src/vebo-ui.ts --bundle --format=esm --outfile=../vebo-ui.js
      - name: Prepare Pages
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp vebo-ui.js _site/vebo-ui.js
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
